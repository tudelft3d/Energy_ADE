# Publishes the contents of _webpages/ to GitHub Pages
# Place this file at: .github/workflows/pages.yml
# Repo admin must set: Settings > Pages > Source = "GitHub Actions"

name: Deploy _webpages to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "_webpages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable Jekyll processing
        run: touch _webpages/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload _webpages folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: _webpages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
